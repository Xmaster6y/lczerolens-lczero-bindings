name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true

permissions:
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: ["ubuntu-latest", "macos-latest"] # TODO: fix windows-latest build errors
    runs-on: ${{ matrix.os }}
    environment: publish
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup build
      run: |
        bash setup.sh
      env:
        LC0_VERSION: ${{ inputs.version }}
    - name: Build package
      run: |
        uv build lc0 -o dist
    - name: Store binary wheel
      uses: actions/upload-artifact@v4
      with:
        name: package-${{ inputs.version }}-${{ strategy.job-index }}
        path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: publish
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        pattern: package-${{ inputs.version }}-*
        merge-multiple: true
        path: dist
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
